query GetFeaturesPage {
    featuresPage {
        Faq {
            Answer
            Question
        }
        Ladder {
            ...LadderFragment
        }
        Seo {
            ...ComponentSeoSeoFragment
        }
        HeroImageFile {
            ...UploadFileFragment
        }
        Title
        TitleUnderline
        UnderlineLeft
        Description
        CtaText
    }
}
